<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Static 2004scape combat simulator rewrite built with React, TypeScript and Vite."
    />
    <title>2004scape Combat Simulator</title>
